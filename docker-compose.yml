version: '3.8'

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: veritas-opensearch
    environment:
      - cluster.name=veritas-cluster
      - node.name=veritas-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=false"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=VeritasX_2026_Secure!
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - veritas-net

  postgres:
    image: postgres:16-alpine
    container_name: veritas-postgres
    environment:
      - POSTGRES_DB=veritas_db
      - POSTGRES_USER=veritas_user
      - POSTGRES_PASSWORD=veritas_secret_pw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - veritas-net

  veritas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritas-api
    depends_on:
      - opensearch
      - postgres
    environment:
      - VERITAS_ENV=production
      - VERITAS_HOST=0.0.0.0
      - VERITAS_PORT=8000
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=VeritasX_2026_Secure!
      - DATABASE_URL=postgresql://veritas_user:veritas_secret_pw@postgres:5432/veritas_db
    ports:
      - "8000:8000"
    volumes:
      - evidence-vault:/app/data/vault
      - reports-store:/app/data/reports
    networks:
      - veritas-net

volumes:
  opensearch-data:
  postgres-data:
  evidence-vault:
  reports-store:

networks:
  veritas-net:
    driver: bridge
